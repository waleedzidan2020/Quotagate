name: QuotaGate QoS priority checks

on:
  pull_request:
    paths:
      - 'app/gaming.py'
      - 'app/qos_priority.py'
      - 'app/main.py'
      - 'app/__init__.py'
      - 'web/qos-gaming.js'
      - 'web/app.js'
      - 'tests/qos_priority_smoke.py'
      - '.github/workflows/qos-ci.yml'

jobs:
  qos-priority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python compile
        run: python -m compileall -q app tests/qos_priority_smoke.py
      - name: QoS semantic smoke tests
        run: python tests/qos_priority_smoke.py
      - name: JavaScript syntax
        run: node --check web/qos-gaming.js && node --check web/app.js
      - name: Safety invariants
        run: |
          grep -q "_fail_open" app/shaping.py
          grep -q "gaming.tick" app/main.py
          grep -q "priority='low'" app/qos_priority.py
          grep -q ".modal\[hidden\]{display:none!important}" web/styles.css
