name: QuotaGate static checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python compile
        run: python3 -m compileall -q app
      - name: Python import smoke test
        run: python3 -c "import app; import app.shaping; import app.diagnostics; import app.guestmode; import app.shaping_policy; import app.dnsproxy; import app.usage_tracker"
      - name: Guest speed policy semantics
        run: |
          python3 - <<'PY'
          from app import guestmode
          c={'guest':{'speed_down_kbit':2000,'speed_up_kbit':512}}
          g={'is_guest':1,'speed_down_kbit':0,'speed_up_kbit':0}
          assert guestmode._effective_rate(g, {}, 'speed_down_kbit', c) == 2000
          assert guestmode._effective_rate(g, {}, 'speed_up_kbit', c) == 512
          assert guestmode._effective_rate({'is_guest':1,'speed_down_kbit':1000}, {}, 'speed_down_kbit', c) == 1000
          assert guestmode._effective_rate({'is_guest':1,'speed_down_kbit':-1}, {}, 'speed_down_kbit', c) == 0
          assert guestmode._role({'is_guest':1}, 'aa:bb:cc:dd:ee:ff', set()) == 'guest'
          assert guestmode._role({}, 'aa:bb:cc:dd:ee:ff', {'aa:bb:cc:dd:ee:ff'}) == 'existing_at_activation'
          assert guestmode._role({'user_id':7}, 'aa:bb:cc:dd:ee:ff', set()) == 'managed'
          assert guestmode._role({}, 'aa:bb:cc:dd:ee:ff', set()) == 'unassigned'
          print('guest policy semantics: OK')
          PY
      - name: Shaping and firewall device safety semantics
        run: |
          python3 - <<'PY'
          from app import shaping_policy
          devices = [
              {'id':1,'ip':'192.168.2.10','mac':'aa:bb:cc:dd:ee:01','last_seen':10,'enabled':0,'blocked_manual':1},
              {'id':2,'ip':'192.168.2.10','mac':'00:00:00:00:00:00','last_seen':99,'enabled':0,'blocked_manual':1},
              {'id':3,'ip':'192.168.2.10','mac':'aa:bb:cc:dd:ee:03','last_seen':20,'enabled':1,'blocked_manual':0},
              {'id':4,'ip':'192.168.2.11','mac':'aa:bb:cc:dd:ee:04','last_seen':5,'enabled':1,'blocked_manual':0},
              {'id':5,'ip':'not-an-ip','mac':'aa:bb:cc:dd:ee:05','last_seen':50,'enabled':1,'blocked_manual':0},
          ]
          shaping_policy._neighbor_map=lambda:{'192.168.2.10':'aa:bb:cc:dd:ee:03'}
          shaping_policy.db.mac_rules=lambda:[]
          safe = shaping_policy._sanitize_devices(devices)
          assert [d['id'] for d in safe] == [3, 4]
          assert shaping_policy._valid_mac('aa:bb:cc:dd:ee:ff')
          assert not shaping_policy._valid_mac('00:00:00:00:00:00')
          assert not shaping_policy._valid_mac('ff:ff:ff:ff:ff:ff')
          blocked=shaping_policy.blocked({'bundle':{'total_gb':100}},[],devices)
          assert '192.168.2.10' not in blocked
          print('shaping/firewall device safety: OK')
          PY
      - name: DNS fallback semantics
        run: |
          python3 - <<'PY'
          from app import dnsproxy
          c={'network':{'uplink_net':'192.168.1.0/24','upstream_dns':['1.1.1.1','8.8.8.8']},'dns':{}}
          assert dnsproxy._uplink_gateway(c)=='192.168.1.1'
          assert dnsproxy.upstreams(c)==['1.1.1.1','8.8.8.8','192.168.1.1']
          c['network']['dns_fallback']='192.168.50.1'
          assert dnsproxy._uplink_gateway(c)=='192.168.50.1'
          assert dnsproxy.error_reply(b'\x12\x34'+b'\x00'*10,2)[:2]==b'\x12\x34'
          print('dns fallback safety: OK')
          PY
      - name: Live usage accounting semantics
        run: |
          python3 - <<'PY'
          import time
          from app import db, usage_tracker
          # Normal delta.
          assert usage_tracker._counter_delta(1000,1500)==500
          # Counter reset/rebuild: new absolute value is baseline only.
          assert usage_tracker._counter_delta(5000,100)==0
          # Service startup: first existing kernel value is not counted.
          assert usage_tracker._counter_delta(None,10*1024*1024)==0
          # No traffic means no delta / no DB write required.
          assert usage_tracker._counter_delta(1000,1000)==0
          # Speed uses actual elapsed time, not an assumed poll interval.
          assert abs(usage_tracker._speed_mbps(1_000_000,2)-4.0)<1e-9
          # Local-midnight bucket rollover uses local system time.
          a=time.mktime((2026,9,7,23,59,59,0,0,-1));b=time.mktime((2026,9,8,0,0,1,0,0,-1))
          assert db.day(a)=='2026-09-07';assert db.day(b)=='2026-09-08'
          print('live usage accounting: OK')
          PY
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/app-core.js
          node --check web/speed-toggle.js
          node --check web/guest-mode.js
          node --check web/guest-shaping.js
          node --check web/live-usage.js
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n scripts/update.sh
          sh -n init/quotagate
          sh -n scripts/network-start.sh
          sh -n scripts/network-stop.sh
          sh -n scripts/diagnose.sh
          sh -n scripts/setup-network.sh
          sh -n scripts/make-cert.sh
          sh -n scripts/pppoe-test.sh
      - name: Secret smoke test
        run: |
          ! grep -RInE --exclude='config.example.json' --exclude-dir='.git' '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|password[[:space:]]*=[[:space:]]*["'"'][^"'"']{8,}["'"'])' .
