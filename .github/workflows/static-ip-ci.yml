name: QuotaGate static IP checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-ip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python compile
        run: python3 -m compileall -q app tests/static_ip_smoke.py
      - name: Static IP semantics
        run: python3 tests/static_ip_smoke.py
      - name: JavaScript syntax
        run: node --check web/static-ip.js
      - name: Loader includes static IP UI
        run: grep -q "static-ip.js" web/app.js
