name: QuotaGate DNS filtering checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  dns-filtering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python compile
        run: python3 -m compileall -q app tests/dns_filtering_smoke.py
      - name: DNS filtering semantics
        run: PYTHONPATH=. python3 tests/dns_filtering_smoke.py
      - name: JavaScript syntax
        run: node --check web/dns-filtering.js
      - name: Main loader syntax
        run: node --check web/app.js
